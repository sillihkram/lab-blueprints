# -------------------------------------------------------------------------
# RHEL 10.2 Kickstart Profile
# Translated from CIS-L1.toml
# Total Disk Size: ~40GB
# Profile: CIS Server Level 1
# -------------------------------------------------------------------------

# Basic installation settings
text
reboot
lang en_US.UTF-8
keyboard us-mac
timezone UTC

# Network and Hostname
network --hostname=localhost --bootproto=dhcp --activate

# Security & User configuration
rootpw --lock
user --name=admin --groups=users,wheel --iscrypted --password="$6$skMsN2VVuSw1y1fw$5PJOJNieWK.TGzT9lew8ROQ//6h2cRt5Kfx/iih4fRIfjUDOL2E1cxOwaja.S7B5T7htXvp6r3iICTA1gpRDx/"

# Services: Enable requested services (Masked services handled in %post)
services --enabled=auditd,crond,firewalld,systemd-journald

# Bootloader & Kernel Arguments
bootloader --append="crashkernel=auto audit_backlog_limit=8192 audit=1"
zerombr
clearpart --all --initlabel

# -------------------------------------------------------------------------
# Storage & Partitioning (40GB Total)
# -------------------------------------------------------------------------
# Standard boot partitions
part /boot/efi --fstype=efi --size=600
part /boot --fstype=xfs --size=1024

# LVM Setup: Grow to fill the remaining disk
part pv.01 --fstype=lvmpv --size=1 --grow
volgroup rhel_vg pv.01

# Fixed-size partitions for CIS compliance (Scaled down from 100GB to 40GB)
logvol /var            --fstype=xfs --name=var      --vgname=rhel_vg --size=5000
logvol /var/log        --fstype=xfs --name=var_log  --vgname=rhel_vg --size=4000
logvol /var/log/audit  --fstype=xfs --name=audit    --vgname=rhel_vg --size=2000
logvol /var/tmp        --fstype=xfs --name=var_tmp  --vgname=rhel_vg --size=2000
logvol /tmp            --fstype=xfs --name=tmp      --vgname=rhel_vg --size=2000
logvol /home           --fstype=xfs --name=home     --vgname=rhel_vg --size=3000
logvol swap            --fstype=swap --name=swap    --vgname=rhel_vg --size=2000

# Root partition: Takes the remaining ~18GB
logvol /               --fstype=xfs --name=root     --vgname=rhel_vg --size=1024 --grow

# -------------------------------------------------------------------------
# OpenSCAP Security Addon
# -------------------------------------------------------------------------
%addon org_fedora_oscap
    content-type = scap-security-guide
    profile = xccdf_org.ssgproject.content_profile_cis_server_l1
%end

# -------------------------------------------------------------------------
# Package Selection
# -------------------------------------------------------------------------
%packages
@^minimal-environment
-plymouth
-plymouth-core
ansible-core
net-tools
openscap-scanner
rhel-system-roles
scap-security-guide
setroubleshoot
vim-enhanced
sudo
libpwquality
systemd-journal-remote
firewalld
nftables
libselinux
chrony
audit-libs
audit
%end

# -------------------------------------------------------------------------
# Post-Installation Script
# -------------------------------------------------------------------------
%post --erroronfail

# Inject SSH Public Key for 'admin' user
mkdir -m 0700 -p /home/admin/.ssh
echo "ssh-rsa " >> /home/admin/.ssh/authorized_keys
chmod 0600 /home/admin/.ssh/authorized_keys
chown -R admin:admin /home/admin/.ssh

# Mask services specified in the blueprint
systemctl mask cups nfs-server rpcbind avahi-daemon autofs bluetooth nftables

%end
